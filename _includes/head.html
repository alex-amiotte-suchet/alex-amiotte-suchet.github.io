{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">

<!-- hreflang: tells search engines these are translations, not duplicate content -->
{% if page.ref %}
  {% for p in site.pages %}
    {% if p.ref == page.ref and p.lang %}
      <link rel="alternate" hreflang="{{ p.lang }}" href="{{ p.url | absolute_url }}">
    {% endif %}
  {% endfor %}
  {% assign default_page = site.pages | where: "ref", page.ref | where: "lang", "en" | first %}
  {% if default_page %}
    <link rel="alternate" hreflang="x-default" href="{{ default_page.url | absolute_url }}">
  {% endif %}
{% endif %}
